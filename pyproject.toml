# Declare package metadata, dependency pins, test settings and bundled UI/prompt assets.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-policy-assistant"
version = "0.1.0"
description = "Walking-skeleton RAG API for the ADC GenAI Engineer case"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.143.0",
    "google-genai==2.29.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "pypdf==6.20.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "web/*.html", "web/*.css", "web/*.js"]
